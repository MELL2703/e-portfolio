<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mell RIAHI — e-Portfolio</title>
    <meta
      name="description"
      content="I'm studying Computer Science at ENSEEIHT — e-Portfolio : projets, parcours, CV FR/EN, sports."
    />
    <meta name="author" content="Mell RIAHI" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <header class="nav">
      <div class="nav-inner">
        <div class="brand">
          <span class="dot" aria-hidden="true"></span>
          <a href="#home" id="brand-home"></a>
        </div>

        <button
          type="button"
          id="burger"
          class="burger"
          aria-label="Ouvrir le menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          ☰
        </button>

        <nav id="menu" aria-label="Principale">
          <!-- Liens générés depuis assets/js/content.js -->
          <ul id="menu-list"></ul>
        </nav>

        <div class="ctrls">
          <a id="cvBtn" class="btn primary" href="#" download>CV</a>
          <a
            id="lnkHeader"
            class="btn icononly linkedin-link"
            href="#"
            target="_blank"
            rel="noopener"
            aria-label="Ouvrir LinkedIn"
          >
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path
                  d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM0 8h5v16H0V8zm7.5 0h4.8v2.2h.07c.67-1.2 2.3-2.46 4.73-2.46 5.06 0 5.99 3.33 5.99 7.66V24h-5v-7.34c0-1.75-.03-4-2.44-4-2.44 0-2.81 1.9-2.81 3.87V24h-5V8z"
                />
              </svg>
            </span>
          </a>
          <button
            type="button"
            id="themeBtn"
            class="btn"
            aria-label="Basculer le thème"
          >
            🌓
          </button>
          <select id="langSel" aria-label="Langue">
            <option value="fr" selected>FR</option>
            <option value="en">EN</option>
          </select>
        </div>
      </div>
    </header>

    <main class="wrap" id="app"><!-- Contenu rendu en JavaScript. --></main>

    <noscript>
      <p class="wrap">Activez JavaScript pour consulter ce portfolio.</p>
    </noscript>

    <footer>
      <small>© <span id="year"></span> <span id="footer-text"></span></small>
      <div class="footer-links">
        <a
          class="linkedin-link"
          id="lnkFooter"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Ouvrir LinkedIn"
        >
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" focusable="false">
              <path
                d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM0 8h5v16H0V8zm7.5 0h4.8v2.2h.07c.67-1.2 2.3-2.46 4.73-2.46 5.06 0 5.99 3.33 5.99 7.66V24h-5v-7.34c0-1.75-.03-4-2.44-4-2.44 0-2.81 1.9-2.81 3.87V24h-5V8z"
              />
            </svg>
          </span>
          <span>LinkedIn</span>
        </a>
      </div>
    </footer>

    <!-- 1) Ton contenu (à remplir)  2) Le moteur du site (pas besoin d'y toucher) -->
    <script src="assets/js/content.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
